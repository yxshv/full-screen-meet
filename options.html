<!doctype html>
<meta charset="utf-8">
<title>Full Screen Meet options</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; margin: 6px 0 12px; }
  button { padding: 8px 14px; margin-right: 8px; }
  #status { margin-top: 12px; color: #188038; }
  #status.err { color: #d93025; }
</style>
<h1>Full Screen Meet</h1>
<label for="url">Screenshot server URL</label>
<input id="url" type="url" placeholder="http://localhost:3000/screenshot">
<label for="key">API key</label>
<input id="key" type="password" autocomplete="off" placeholder="Must match the server's API_KEY">
<button id="save">Save</button><button id="reset">Reset to config.json</button>
<p>Screenshots are POSTed here as <code>image/jpeg</code>. Reset clears both fields and falls back to <code>serverUrl</code> / <code>apiKey</code> from <code>config.json</code>. The key is sent as <code>Authorization: Bearer &lt;key&gt;</code>. Non-localhost servers will ask for permission to that host when you save.</p>
<div id="status"></div>
<script src="options.js"></script>
